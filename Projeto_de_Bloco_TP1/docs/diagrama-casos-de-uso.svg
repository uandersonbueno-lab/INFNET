<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" width="980" height="720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="980" height="720" fill="#ffffff"/>

  <!-- Fronteira do sistema -->
  <rect x="210" y="20" width="740" height="680" rx="6" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="580" y="48" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Sistema de Gestão de Biblioteca Universitária</text>

  <!-- Associações: Membro -->
  <g stroke="#555" stroke-width="1.3">
    <line x1="125" y1="215" x2="295" y2="100"/>
    <line x1="125" y1="215" x2="295" y2="185"/>
    <line x1="125" y1="215" x2="295" y2="270"/>
    <line x1="125" y1="215" x2="295" y2="355"/>
  </g>
  <!-- Associações: Bibliotecário -->
  <g stroke="#555" stroke-width="1.3">
    <line x1="125" y1="505" x2="295" y2="100"/>
    <line x1="125" y1="505" x2="295" y2="185"/>
    <line x1="125" y1="505" x2="295" y2="270"/>
    <line x1="125" y1="505" x2="295" y2="355"/>
    <line x1="125" y1="505" x2="295" y2="460"/>
    <line x1="125" y1="505" x2="295" y2="540"/>
    <line x1="125" y1="505" x2="295" y2="620"/>
  </g>

  <!-- Ator: Membro -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="100" cy="190" r="12" fill="#fff"/>
    <line x1="100" y1="202" x2="100" y2="240"/>
    <line x1="78" y1="215" x2="122" y2="215"/>
    <line x1="100" y1="240" x2="82" y2="268"/>
    <line x1="100" y1="240" x2="118" y2="268"/>
  </g>
  <text x="100" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Membro</text>
  <text x="100" y="307" text-anchor="middle" font-size="11" fill="#444">(aluno, professor,</text>
  <text x="100" y="321" text-anchor="middle" font-size="11" fill="#444">funcionário)</text>

  <!-- Ator: Bibliotecário -->
  <g stroke="#222" stroke-width="2" fill="none">
    <circle cx="100" cy="480" r="12" fill="#fff"/>
    <line x1="100" y1="492" x2="100" y2="530"/>
    <line x1="78" y1="505" x2="122" y2="505"/>
    <line x1="100" y1="530" x2="82" y2="558"/>
    <line x1="100" y1="530" x2="118" y2="558"/>
  </g>
  <text x="100" y="580" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Bibliotecário /</text>
  <text x="100" y="597" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Administrador</text>

  <!-- Casos de uso principais -->
  <g fill="#ffffff" stroke="#2b5797" stroke-width="1.6">
    <ellipse cx="430" cy="100" rx="135" ry="27"/>
    <ellipse cx="430" cy="185" rx="135" ry="27"/>
    <ellipse cx="430" cy="270" rx="135" ry="27"/>
    <ellipse cx="430" cy="355" rx="135" ry="27"/>
    <ellipse cx="430" cy="460" rx="135" ry="27"/>
    <ellipse cx="430" cy="540" rx="135" ry="27"/>
    <ellipse cx="430" cy="620" rx="135" ry="27"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="430" y="95" font-size="10" font-weight="bold" fill="#2b5797">UC01</text>
    <text x="430" y="110" font-size="12.5">Consultar acervo e disponibilidade</text>
    <text x="430" y="180" font-size="10" font-weight="bold" fill="#2b5797">UC02</text>
    <text x="430" y="195" font-size="12.5">Realizar empréstimo</text>
    <text x="430" y="265" font-size="10" font-weight="bold" fill="#2b5797">UC03</text>
    <text x="430" y="280" font-size="12.5">Registrar devolução</text>
    <text x="430" y="350" font-size="10" font-weight="bold" fill="#2b5797">UC04</text>
    <text x="430" y="365" font-size="12.5">Realizar reserva</text>
    <text x="430" y="455" font-size="10" font-weight="bold" fill="#2b5797">UC05</text>
    <text x="430" y="470" font-size="12.5">Gerenciar acervo (livros e exemplares)</text>
    <text x="430" y="535" font-size="10" font-weight="bold" fill="#2b5797">UC06</text>
    <text x="430" y="550" font-size="12.5">Gerenciar membros</text>
    <text x="430" y="615" font-size="10" font-weight="bold" fill="#2b5797">UC07</text>
    <text x="430" y="630" font-size="12.5">Gerenciar multas</text>
  </g>

  <!-- Casos de uso auxiliares (include / extend) -->
  <g fill="#ffffff" stroke="#7a7a7a" stroke-width="1.4">
    <ellipse cx="800" cy="185" rx="125" ry="27"/>
    <ellipse cx="800" cy="270" rx="125" ry="27"/>
    <ellipse cx="800" cy="355" rx="125" ry="27"/>
  </g>
  <g text-anchor="middle" fill="#222">
    <text x="800" y="180" font-size="10" font-weight="bold" fill="#555">UC08</text>
    <text x="800" y="195" font-size="12.5">Validar membro e exemplar</text>
    <text x="800" y="265" font-size="10" font-weight="bold" fill="#555">UC09</text>
    <text x="800" y="280" font-size="12.5">Calcular multa por atraso</text>
    <text x="800" y="350" font-size="10" font-weight="bold" fill="#555">UC10</text>
    <text x="800" y="365" font-size="12.5">Verificar exemplares emprestados</text>
  </g>

  <!-- Relacionamentos -->
  <g stroke="#333" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <line x1="565" y1="185" x2="675" y2="185" marker-end="url(#seta)"/>
    <line x1="675" y1="270" x2="565" y2="270" marker-end="url(#seta)"/>
    <line x1="565" y1="355" x2="675" y2="355" marker-end="url(#seta)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#333">
    <text x="620" y="176">«include»</text>
    <text x="620" y="261">«extend»</text>
    <text x="620" y="288" font-size="10" fill="#666">[após o prazo]</text>
    <text x="620" y="346">«include»</text>
  </g>
</svg>
